<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mark Evolver</title>
  <link rel="stylesheet" href="/static/evolve.css">
</head>
<body>
  <header>
    <div id="run-bar">
      <select id="run-select"></select>
      <button id="new-run">New run…</button>
      <button id="restart-run" disabled>Restart</button>
      <span id="run-name"></span>
    </div>
    <div id="gen-bar">
      <button id="prev-gen" disabled>&#8592;</button>
      <span id="gen-label">no run loaded</span>
      <button id="next-gen" disabled>&#8594;</button>
      <label>offspring
        <input type="number" id="n-offspring" min="1" max="200" value="16">
      </label>
      <label><input type="checkbox" id="elitism" checked> keep parents</label>
      <button id="breed" disabled>Breed next generation</button>
      <span id="sel-count"></span>
    </div>
  </header>
  <main id="grid"></main>
  <script src="/static/evolve.js"></script>
</body>
</html>
